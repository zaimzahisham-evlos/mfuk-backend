name: Staging CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0
      SECRET_KEY: ci-test-secret-key-not-for-production
      SUPERADMIN_PASSWORD: ci-superadmin-password
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  build-and-push:
    needs: test                    # ← only runs if tests pass
    if: github.event_name != 'pull_request'   # don't push on PRs (optional)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: zaimevlos/mfuk-backend:testing